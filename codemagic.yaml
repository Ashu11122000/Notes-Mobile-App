workflows:
  android-release:
    name: Android Release APK

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: feature/CI-CD-using-codemagic
          include: true
          source: true

    environment:
      flutter: stable

    working_directory: notes_app

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Flutter Version
        script: |
          flutter --version

      - name: Install Dependencies
        script: |
          flutter pub get

      - name: Generate Code
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Analyze
        script: |
          flutter analyze

      - name: Run Tests
        script: |
          flutter test

      - name: Build Release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - ashul1vats@gmail.com
