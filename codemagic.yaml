workflows:
  android-release:
    name: Android Release

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable

    working_directory: notes_app

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Flutter Version
        script: |
          flutter --version

      - name: Install Dependencies
        script: |
          flutter pub get

      - name: Generate Code
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Tests
        script: |
          flutter test

      - name: Build Release APK
        script: |
          flutter build apk \
            --release \
            --build-number=$BUILD_NUMBER

      - name: Build Release AAB
        script: |
          flutter build appbundle \
            --release \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - ashul1vats@gmail.com
