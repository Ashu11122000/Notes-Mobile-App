name: notes_app
description: A production-ready Flutter Notes application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ==============================================================================
# Dependencies
# ==============================================================================
dependencies:
  flutter:
    sdk: flutter

  # =============================================================================
  # UI
  # =============================================================================
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

  # =============================================================================
  # State Management
  # =============================================================================
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # =============================================================================
  # Networking
  # =============================================================================
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0

  # =============================================================================
  # Navigation
  # =============================================================================
  go_router: ^17.3.0

  # =============================================================================
  # Local Storage
  # =============================================================================
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

  # =============================================================================
  # JSON Serialization
  # =============================================================================
  json_annotation: ^4.9.0

  # =============================================================================
  # Connectivity
  # =============================================================================
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.1

  # =============================================================================
  # Logging
  # =============================================================================
  logger: ^2.7.0

  # =============================================================================
  # Notifications
  # =============================================================================
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^4.1.1

  # =============================================================================
  # Native Features
  # =============================================================================
  image_picker: ^1.2.3

  # =============================================================================
  # File System
  # =============================================================================
  path_provider: ^2.1.5
  path: ^1.9.1

  # =============================================================================
  # Environment Configuration
  # =============================================================================
  flutter_dotenv: ^6.0.0

  # =============================================================================
  # Utilities
  # =============================================================================
  intl: ^0.20.3
  uuid: ^4.6.0
  equatable: ^2.0.7

# ==============================================================================
# Development Dependencies
# ==============================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # =============================================================================
  # Testing
  # =============================================================================
  mocktail: ^1.0.5
  fake_async: ^1.3.3

  # =============================================================================
  # Code Generation
  # =============================================================================
  build_runner: ^2.7.1

  riverpod_generator: ^3.0.3
  json_serializable: ^6.11.1

# ==============================================================================
# Flutter Configuration
# ==============================================================================
flutter:
  uses-material-design: true

  # =============================================================================
  # Assets
  # =============================================================================
  assets:
    - .env
    # - assets/images/
    # - assets/icons/

  # =============================================================================
  # Fonts
  # =============================================================================
  # Google Fonts are loaded dynamically.
  # No local font configuration is required.
