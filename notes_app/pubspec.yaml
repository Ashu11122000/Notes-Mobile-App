name: notes_app
description: "A production-ready Flutter Notes application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ============================
  # UI
  # ============================
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

  # ============================
  # State Management
  # ============================
  provider: ^6.1.5+1

  # ============================
  # Networking
  # ============================
  dio: ^5.10.0

  # ============================
  # Routing
  # ============================
  go_router: ^17.3.0

  # ============================
  # Local Storage
  # ============================
  shared_preferences: ^2.5.5

  # ============================
  # Connectivity
  # ============================
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.1

  # ============================
  # Logging
  # ============================
  logger: ^2.7.0

  # ============================
  # Notifications
  # ============================
  flutter_local_notifications: ^22.1.0

  # ============================
  # Image Picker (Phase 7)
  # ============================
  image_picker: ^1.2.3

  # Provides application directories
  path_provider: ^2.1.5

  # File path utilities
  path: ^1.9.1

  # ============================
  # Utilities
  # ============================
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # ============================
  # Assets
  # ============================
  # Uncomment and add assets when needed.
  #
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # ============================
  # Fonts
  # ============================
  # Google Fonts are used, so no local font
  # configuration is required at this time.
