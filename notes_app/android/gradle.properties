# ==============================================================================
# Gradle JVM Configuration
# Optimized for Dell Inspiron 5590
# Intel i5 (4C/8T)
# 8 GB RAM
# ==============================================================================

org.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvm.options=-Xmx1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# ==============================================================================
# AndroidX
# ==============================================================================

android.useAndroidX=true

# ==============================================================================
# Flutter Template Flags
# Keep these aligned with the Flutter SDK.
# ==============================================================================

android.newDsl=false
android.builtInKotlin=false

# ==============================================================================
# Kotlin
# Incremental compilation improves rebuild times.
# ==============================================================================

kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ==============================================================================
# Gradle Performance
# ==============================================================================

org.gradle.parallel=true
org.gradle.caching=true

# Configure-on-demand is no longer recommended for modern Android builds.
org.gradle.configureondemand=false

# ==============================================================================
# Android Build
# ==============================================================================

android.nonTransitiveRClass=true
android.nonFinalResIds=false