# ==============================================================================
# Alembic Configuration
# ==============================================================================
#
# Project : Notes Backend
# Database: PostgreSQL
# ORM     : SQLAlchemy 2.x
#
# NOTE:
# The database URL is NOT read from this file.
# It is loaded dynamically inside alembic/env.py from the application settings.
#
# ==============================================================================

[alembic]

script_location = %(here)s/alembic

prepend_sys_path = .

path_separator = os

# Placeholder only.
# The real database URL is injected inside alembic/env.py.
sqlalchemy.url = postgresql://user:password@localhost/database


# ==============================================================================
# Logging
# ==============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = default


# ==============================================================================
# Root Logger
# ==============================================================================

[logger_root]
level = WARNING
handlers = console


# ==============================================================================
# SQLAlchemy Logger
# ==============================================================================

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


# ==============================================================================
# Alembic Logger
# ==============================================================================

[logger_alembic]
level = INFO
handlers =
qualname = alembic


# ==============================================================================
# Console Handler
# ==============================================================================

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = default


# ==============================================================================
# Formatter
# ==============================================================================

[formatter_default]
format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S


# ==============================================================================
# Post Write Hooks
# ==============================================================================
#
# Example:
#
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME
#
# ==============================================================================
[post_write_hooks]